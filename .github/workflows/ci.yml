name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asbesthub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asbesthub_test
      # Format-valid dummy keys so `next build` can render the Clerk provider. Real keys live in Vercel.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      APP_URL: http://localhost:3000
      LOCAL_STORAGE_DIR: .local-storage
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          NODE_ENV: production
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: Playwright e2e (only when Clerk test secrets are set)
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asbesthub_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asbesthub_e2e
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      SEED_ORG_ID: ${{ secrets.E2E_CLERK_ORG_ID }}
      APP_URL: http://localhost:3000
      LOCAL_STORAGE_DIR: .local-storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$E2E_CLERK_USER_EMAIL" ] || [ -z "$CLERK_SECRET_KEY" ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.secrets.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.secrets.outputs.enabled == 'true'
        run: pnpm db:migrate && pnpm db:seed
      - if: steps.secrets.outputs.enabled == 'true'
        run: pnpm build
      - if: steps.secrets.outputs.enabled == 'true'
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ""
      - if: always() && steps.secrets.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
